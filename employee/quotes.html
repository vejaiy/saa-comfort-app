</main>
<script src="../assets/js/pricing-data.js?v=20260925b"></script>
<script src="../assets/js/worksheet.js?v=20260925b"></script>
<script src="../assets/js/jobs-db.js?v=20260925b"></script>
<script src="../assets/js/quotes-db.js?v=20260925b"></script>
<script>
  // Round 44: quote status isn't editable from this list (same "read here,
  // edit on the worksheet" split as the Invoices list) -- a plain label
  // map, same idea as _invStatusLabel in gen_invoices.py.
  const _qStatusLabel = { draft: "Draft", sent: "Sent", accepted: "Accepted", declined: "Declined" };

  function _qEsc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function _qCustName(c) {
    if (!c) return "&mdash;";
    return _qEsc([c.first_name, c.last_name].filter(Boolean).join(" ") || "(no name)");
  }
  function _qWorksheetPage(quote) {
    return quote.quote_type === "repair" ? "repair.html" : "quotation.html";
  }
  function _qDate(iso) {
    if (!iso) return "&mdash;";
    const d = new Date(iso);
    if (isNaN(d.getTime())) return "&mdash;";
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  }

  let _qAll = [];
  let _qLastRows = [];

  function _qFilteredRows() {
    const type = document.getElementById("q-type-filter").value;
    const status = document.getElementById("q-status-filter").value;
    const search = (document.getElementById("q-search").value || "").trim().toLowerCase();
    return _qAll.filter((q) => {
      if (type && q.quote_type !== type) return false;
      if (status && q.status !== status) return false;
      if (search) {
        const hay = [
          q.quote_number, q.job_address,
          q.customer && q.customer.first_name, q.customer && q.customer.last_name, q.customer && q.customer.phone,
        ].filter(Boolean).join(" ").toLowerCase();
        if (!hay.includes(search)) return false;
      }
      return true;
    });
  }

  function renderQuotes() {
    const rows = _qFilteredRows();
    _qLastRows = rows;
    const tbody = document.getElementById("q-tbody");
    document.getElementById("q-empty").hidden = rows.length > 0;
    const totalValue = rows.reduce((sum, r) => sum + (Number(r.total) || 0), 0);
    document.getElementById("q-summary").textContent = rows.length
      ? `${rows.length} quote${rows.length === 1 ? "" : "s"} &middot; ${fmtMoney(totalValue)} total`.replace(/&middot;/g, "\u00b7")
      : "";

    tbody.innerHTML = rows.map((q) => `<tr class="jb-row" data-quote-id="${q.id}" data-quote-page="${_qWorksheetPage(q)}">
        <td>${_qEsc(q.quote_number) || "&mdash;"}</td>
        <td>${_qDate(q.created_at)}</td>
        <td>${_qCustName(q.customer)}</td>
        <td>${_qEsc(saaJobTypeLabel(q.quote_type))}</td>
        <td>${_qEsc(q.job_address) || "&mdash;"}</td>
        <td>${q.job ? _qEsc(q.job.job_number || saaJobTypeLabel(q.job.job_type)) : "&mdash;"}</td>
        <td>${fmtMoney(q.total)}</td>
        <td><span class="jb-badge">${_qStatusLabel[q.status] || q.status || "&mdash;"}</span></td>
      </tr>`).join("");

    // Round 48 (2026-09-23), per Vijayan: "when quotes clicked in quotes
    // page, open them in pdf format, not the webform." &autoprint=1 tells
    // the worksheet page (quotation.html/repair.html) to load this quote's
    // data and then immediately run its own Print Quote flow instead of
    // sitting open as an editable form -- see that flag's handling at the
    // bottom of gen_master.py/gen_repair.py.
    tbody.querySelectorAll(".jb-row").forEach((tr) => {
      tr.addEventListener("click", () => {
        window.open(`${tr.dataset.quotePage}?quote=${encodeURIComponent(tr.dataset.quoteId)}&autoprint=1`, "_blank", "noopener");
      });
    });
  }

  document.getElementById("q-type-filter").addEventListener("change", renderQuotes);
  document.getElementById("q-status-filter").addEventListener("change", renderQuotes);
  let _qSearchTimer = null;
  document.getElementById("q-search").addEventListener("input", () => {
    clearTimeout(_qSearchTimer);
    _qSearchTimer = setTimeout(renderQuotes, 200);
  });
  document.getElementById("q-clear-btn").addEventListener("click", () => {
    document.getElementById("q-type-filter").value = "";
    document.getElementById("q-status-filter").value = "";
    document.getElementById("q-search").value = "";
    renderQuotes();
  });

  function _qCsvField(v) {
    const s = String(v == null ? "" : v);
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  }
  document.getElementById("q-download-btn").addEventListener("click", () => {
    const header = ["Quote #", "Date", "Customer", "Type", "Job Address", "Linked Job", "Total", "Status"];
    const lines = [header.map(_qCsvField).join(",")];
    _qLastRows.forEach((q) => {
      lines.push([
        q.quote_number,
        (q.created_at || "").slice(0, 10),
        q.customer ? [q.customer.first_name, q.customer.last_name].filter(Boolean).join(" ") : "",
        saaJobTypeLabel(q.quote_type),
        q.job_address || "",
        q.job ? (q.job.job_number || saaJobTypeLabel(q.job.job_type)) : "",
        fmtMoney(q.total),
        _qStatusLabel[q.status] || q.status || "",
      ].map(_qCsvField).join(","));
    });
    const blob = new Blob([lines.join("\n")], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `SAA-quotes-${new Date().toISOString().slice(0, 10)}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });

  (async function init() {
    _qAll = await saaQuotesFetchAll();
    renderQuotes();
  })();
</script>
</body>
