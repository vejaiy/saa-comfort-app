<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employee Login | SAA Comfort Air LLC</title>
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/style.css?v=20260911a">
</head>
<body>
<div class="login-shell">
  <div class="login-card">
    <div class="mark">SA</div>
    <h2 style="margin-bottom:4px">Employee Access</h2>
    <p class="muted" style="margin-bottom:18px">SAA Comfort Air LLC internal tools</p>
    <form id="login-form">
      <div class="field" style="text-align:left">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="username" autofocus required>
      </div>
      <div class="field" style="text-align:left">
        <label for="pw">Password</label>
        <input type="password" id="pw" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%" id="login-btn">Log In</button>
      <div class="login-error" id="err"></div>
    </form>
    <p style="margin-top:18px"><a href="../index.html">&larr; Back to public site</a></p>
  </div>
</div>
<script src="../assets/js/vendor/supabase.js?v=20260911a"></script>
<script src="../assets/js/supabase-config.js?v=20260911a"></script>
<script src="../assets/js/auth.js?v=20260911a"></script>
<script>
  (async function () {
    if (await saaIsAuthed()) window.location.href = "dashboard.html";
  })();

  document.getElementById("login-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const pw = document.getElementById("pw").value;
    const btn = document.getElementById("login-btn");
    const err = document.getElementById("err");
    err.textContent = "";
    btn.disabled = true;
    btn.textContent = "Logging in…";
    const result = await saaLogin(email, pw);
    if (result.ok) {
      window.location.href = "dashboard.html";
    } else {
      err.textContent = "Login failed: " + result.message;
      document.getElementById("pw").value = "";
      document.getElementById("pw").focus();
      btn.disabled = false;
      btn.textContent = "Log In";
    }
  });
</script>
</body>
</html>
