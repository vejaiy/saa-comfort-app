<script>
  // Round 41 (2026-09-18), per Vijayan's reference spreadsheet: added a
  // Configuration picker -- see the configOptions doc comment on
  // renderLineItemTable in worksheet.js. includedFirst reorders the table
  // to Included, Item, Category, Unit, Qty, Unit $, Ext. to match that
  // spreadsheet's column order.
  const wsTable = renderLineItemTable(document.getElementById('ws-table'), COIL_MATERIALS, {
    linkedOptions: COIL_TONNAGE,
    linkedKind: 'tonnage',
    configOptions: [
    { key: 'upflow', label: 'Upflow', field: 'includedUpflow' },
    { key: 'horizontal', label: 'Horizontal', field: 'includedHorizontal' },
  ],
    includedFirst: true
  });

  // Round 40 (2026-09-18): Download button. These worksheet tables are
  // rendered with renderLineItemTable() *without* opts.editableText, which
  // means qty/price/included edits the tech makes only ever get written to
  // the DOM inputs -- renderLineItemTable's own recalc() only writes back
  // into the underlying COIL_MATERIALS array when editableText is on (see
  // worksheet.js). So to export exactly what's on screen (not stale
  // defaults), this reads the live <table> DOM directly rather than the
  // JS data array -- same end result as the Tool List / Jobs / BOM /
  // Invoices / Payments downloads, just sourced differently.
  // Round 41 (2026-09-18): column order matches the table's own
  // includedFirst layout (Included, Item, Category, Unit, Qty, Unit $,
  // Ext.), and the filename includes the currently-selected Configuration
  // so an exported file is traceable to which parts list it came from.
  function _wsCsvField(v) {
    const s = String(v == null ? "" : v);
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  }
  document.getElementById('ws-download-btn').addEventListener('click', () => {
    const mountEl = document.getElementById('ws-table');
    const header = ["Included", "Item", "Category", "Unit", "Qty", "Unit $", "Ext."];
    const lines = [header.map(_wsCsvField).join(",")];
    mountEl.querySelectorAll("tbody tr[data-row]").forEach((tr) => {
      const included = tr.querySelector(".row-toggle").checked ? "Yes" : "No";
      const itemInput = tr.querySelector(".item-input");
      let item;
      if (itemInput) {
        item = itemInput.value;
      } else {
        const clone = tr.querySelector(".item-name").cloneNode(true);
        const spec = clone.querySelector(".spec");
        if (spec) spec.remove();
        item = clone.textContent.trim();
      }
      const catInput = tr.querySelector(".cat-input");
      const category = catInput ? catInput.value : (tr.children[2].textContent || "").trim();
      const unit = (tr.children[3].textContent || "").trim();
      const qty = tr.querySelector(".qty").value;
      const price = tr.querySelector(".price").value;
      const ext = tr.querySelector(".ext").textContent.trim();
      lines.push([included, item, category, unit, qty, price, ext].map(_wsCsvField).join(","));
    });
    const blob = new Blob([lines.join("\n")], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `SAA-coil-change-${wsTable.getConfigValue() || "config"}-${new Date().toISOString().slice(0, 10)}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });
</script>
