</div>

<script src="../assets/js/pricing-data.js?v=20260911a"></script>
<script src="../assets/js/worksheet.js?v=20260911a"></script>
<script>
  const list = document.getElementById('checklist');
  list.innerHTML = INSPECTION_ITEMS.map((item, i) => `
    <li data-i="${i}">
      <input type="checkbox" id="chk-${i}">
      <label for="chk-${i}">${item}</label>
    </li>`).join('');

  function updateProgress() {
    const boxes = list.querySelectorAll('input[type=checkbox]');
    let checked = 0;
    boxes.forEach(b => { b.closest('li').classList.toggle('checked', b.checked); if (b.checked) checked++; });
    document.getElementById('checklist-progress').textContent = `${checked} / ${boxes.length}`;
  }
  list.addEventListener('change', updateProgress);
  document.getElementById('reset-checklist').addEventListener('click', () => {
    list.querySelectorAll('input[type=checkbox]').forEach(b => b.checked = false);
    updateProgress();
  });
  updateProgress();
</script>
