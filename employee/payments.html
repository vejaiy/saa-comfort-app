<div class="note-box blue">Every payment recorded across every job, newest first. Click a row to open that job's Job Card.</div>

<div class="jobs-toolbar">
  <input type="text" id="pay-search" placeholder="Invoice #, job #, customer, phone, or reference #&hellip;" style="min-width:260px">

      </thead>

    </table>

</main>
<script src="../assets/js/pricing-data.js?v=20261001b"></script>
<script src="../assets/js/worksheet.js?v=20261001b"></script>
<script src="../assets/js/xlsx-export.js?v=20261001b"></script>
<script src="../assets/js/jobs-db.js?v=20261001b"></script>
<script src="../assets/js/payments-db.js?v=20261001b"></script>
<script>
  function _payEsc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function _payCustName(c) {
    if (!c) return "&mdash;";
    return _payEsc([c.first_name, c.last_name].filter(Boolean).join(" ") || "(no name)");
  }
  function _payJobLabel(job) {
    if (!job) return "&mdash;";
    return _payEsc(job.job_number || saaJobTypeLabel(job.job_type));
  }

  function _payFilters() {
    return {
      search: document.getElementById("pay-search").value || undefined,
      dateFrom: document.getElementById("pay-date-from").value || undefined,
      dateTo: document.getElementById("pay-date-to").value || undefined,
    };
  }

  // Round 39 (2026-09-19): cache the last-rendered (i.e. currently
  // filtered) rows so the Download button exports exactly what's on
  // screen, not the whole unfiltered table.
  let _payLastRows = [];

  async function renderPayments() {
    const rows = await saaPaymentsFetchAll(_payFilters());
    _payLastRows = rows;
    const tbody = document.getElementById("pay-tbody");
    document.getElementById("pay-empty").hidden = rows.length > 0;
    const total = rows.reduce((sum, r) => sum + (Number(r.amount) || 0), 0);
    document.getElementById("pay-summary").textContent = rows.length
      ? `${rows.length} payment${rows.length === 1 ? "" : "s"} &middot; ${fmtMoney(total)} total`.replace(/&middot;/g, "\u00b7")
      : "";

    tbody.innerHTML = rows.map((r) => {
      const jobId = r.job ? r.job.id : "";
      return `<tr class="jb-row" data-job-id="${jobId}" style="cursor:${jobId ? "pointer" : "default"}">
        <td>${_payEsc(r.payment_date)}</td>
        <td>${_payCustName(r.customer)}</td>
        <td>${_payJobLabel(r.job)}</td>
        <td>${_payEsc(r.invoice ? r.invoice.invoice_number : "")}</td>
        <td>${fmtMoney(r.amount)}</td>
        <td>${_payEsc(r.method)}</td>
        <td>${_payEsc(r.reference_number)}</td>
        <td class="muted" style="font-size:.82rem">${_payEsc(r.notes)}</td>
      </tr>`;
    }).join("");

    tbody.querySelectorAll("tr.jb-row[data-job-id]").forEach((tr) => {
      const jobId = tr.dataset.jobId;
      if (!jobId) return;
      tr.addEventListener("click", () => { window.location.href = `jobs.html?job=${encodeURIComponent(jobId)}`; });
    });
  }

  let _paySearchTimer = null;
  document.getElementById("pay-search").addEventListener("input", () => {
    clearTimeout(_paySearchTimer);
    _paySearchTimer = setTimeout(renderPayments, 200);
  });
  document.getElementById("pay-date-from").addEventListener("change", renderPayments);
  document.getElementById("pay-date-to").addEventListener("change", renderPayments);
  document.getElementById("pay-clear-btn").addEventListener("click", () => {
    document.getElementById("pay-search").value = "";
    document.getElementById("pay-date-from").value = "";
    document.getElementById("pay-date-to").value = "";
    renderPayments();
  });

  // Same CSV-via-Blob approach as the Tool List / Mileage / Jobs / Invoices
  // pages -- opens straight into Excel, no extra library needed.
  document.getElementById("pay-download-btn").addEventListener("click", () => {
    const rows = _payLastRows.map((r) => [
      r.payment_date,
      r.customer ? [r.customer.first_name, r.customer.last_name].filter(Boolean).join(" ") : "",
      r.job ? (r.job.job_number || saaJobTypeLabel(r.job.job_type)) : "",
      r.invoice ? r.invoice.invoice_number : "",
      Number(r.amount) || 0,
      r.method,
      r.reference_number,
      r.notes,
    ]);
    saaXlsxDownload("SAA-payments-" + saaXlsxStamp(), [{
      name: "Payments", tabColor: "548235",
      title: "SAA Comfort Air LLC — Payments",
      subtitle: "Generated " + saaXlsxTodayLabel() + "   |   " + rows.length + " payment" + (rows.length === 1 ? "" : "s") + " (as filtered on screen)",
      freezeCols: 1, totals: true, emptyText: "No payments match the current filters.",
      columns: [
        { header: "Date", width: 13, type: "date" }, { header: "Customer", width: 26 }, { header: "Job", width: 20 },
        { header: "Invoice #", width: 16 }, { header: "Amount", width: 13, type: "money", total: true },
        { header: "Method", width: 16, type: "center" }, { header: "Reference #", width: 18 }, { header: "Notes", width: 40, type: "wrap" },
      ],
      rows,
    }]);
  });

  renderPayments();
</script>
