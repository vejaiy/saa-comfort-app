<div class="breadcrumb"><a href="dashboard.html">Employee</a> &rsaquo; Instruction Manual</div>
<div class="page-title-row">
  <h1>Instruction Manual</h1>
</div>
<div class="note-box blue">Equipment installation/service manuals, synced from the office computer's Manuals folder. Click a title to open or download it.</div>
<div id="manuals-list"></div>
<p class="muted" id="manuals-empty" hidden>No manuals synced yet.</p>

</main>
<script src="../assets/js/pricing-data.js?v=20260912c"></script>
<script src="../assets/js/worksheet.js?v=20260912c"></script>
<script src="../assets/js/manuals-db.js?v=20260912c"></script>
<script>
  (async () => {
    const list = document.getElementById('manuals-list');
    const empty = document.getElementById('manuals-empty');
    try {
      const manuals = await saaManualsFetchAll();
      if (!manuals.length) { empty.hidden = false; return; }
      list.innerHTML = manuals.map(m => {
        const sizeKb = m.file_size_bytes ? Math.round(m.file_size_bytes / 1024).toLocaleString() + ' KB' : '';
        const updated = m.uploaded_at ? new Date(m.uploaded_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '';
        return `<a class="manual-row" href="../assets/manuals/${encodeURIComponent(m.filename)}" target="_blank" rel="noopener" style="text-decoration:none;color:inherit">
          <div>
            <div class="name">📄 ${m.title}</div>
            <div class="meta">${[sizeKb, updated ? 'Updated ' + updated : ''].filter(Boolean).join(' &middot; ')}</div>
          </div>
          <span class="btn btn-ghost btn-sm">Open ↗</span>
        </a>`;
      }).join('');
    } catch (e) {
      empty.hidden = false;
      empty.textContent = 'Could not load the manuals list.';
    }
  })();
</script>
</body>
